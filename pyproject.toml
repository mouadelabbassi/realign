[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realign-poc0"
version = "0.1.0"
description = "REALIGN: verified pendulum physics and synthetic classical baselines (POC-0)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
meta = ["openai>=1.0"]
perception = ["opencv-python-headless>=4.10,<5", "meta-sam-parser==0.1.0", "openai>=1.109.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
