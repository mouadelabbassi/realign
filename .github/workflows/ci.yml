name: REALIGN scientific regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install FFmpeg and offline test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e ".[dev,perception]"
      - name: Unit and integration tests (no credentials)
        run: python -m pytest -q
      - name: Reproduce numerical and offline perception evidence
        run: |
          python scripts/verify_g1.py
          python scripts/verify_baselines.py
          python scripts/verify_g2.py
          python scripts/verify_structural.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evidence-python-${{ matrix.python }}
          path: |
            artifacts/G1_REPORT.md
            artifacts/g1_verification.json
            artifacts/POC0_BASELINES.md
            artifacts/poc0_baselines.json
            artifacts/G2_READINESS.md
            artifacts/g2_readiness.json
            artifacts/g2_fixture_comparison.png
            artifacts/B3_BASELINES.md
            artifacts/b3_baselines.json
            artifacts/b3_trajectories.png
  investigator-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install offline scientific runtime
        run: python -m pip install -e ".[dev,perception]"
      - name: Recalibrate and reproduce matched offline investigations
        run: python scripts/verify_investigator.py --calibrate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task04-offline-investigator
          path: artifacts/task04/
  product-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REALIGN_BROWSER_TESTS: "1"
      REALIGN_SCREENSHOT_DIR: artifacts/release/ci_screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install -e ".[dev,perception,ui-test]"
          python -m playwright install --with-deps chromium
      - name: Verify cached product without credentials or fitting
        run: python -m pytest -q tests/test_product_browser.py tests/test_task06_browser.py tests/vfinal/test_browser.py --junitxml=artifacts/release/browser_tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfinal-product-browser
          path: |
            artifacts/release/browser_tests.xml
            artifacts/release/ci_screenshots/
